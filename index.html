<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shield Pro • Access Control</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.85);
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-color) 80%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px 28px;
            width: 340px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .icon-container {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2.5s infinite ease-in-out;
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-top: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
            display: none; /* Only shown if app not detected */
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">🛡️</div>
        <h2 id="titleText">Opening Shield Pro</h2>
        <p id="statusText">Verifying app installation...</p>

        <!-- Direct App Open Button -->
        <a id="openAppBtn" href="#" class="btn">Launch App</a>

        <!-- Auto-Download Button -->
        <a id="downloadBtn" href="#" class="btn btn-secondary">Download Shield Pro APK</a>
    </div>

    <script>
        // APK Release URL
        const apkDownloadUrl = "https://github.com/gsshetty357-gif/shieldpro/releases/download/v5.01/ShieldPro.apk";

        const urlParams = new URLSearchParams(window.location.search);
        const isFallback = urlParams.get('fallback') === 'true';

        // Build fallback landing URL
        const fallbackUrl = window.location.origin + window.location.pathname + window.location.search + 
                            (window.location.search ? '&' : '?') + 'fallback=true';
        
        // Build Intent String with S.browser_fallback_url
        const intentUri = "intent://play" + window.location.search + 
                          "#Intent;scheme=shieldpro;package=com.aistudio.shieldpro.vltq;S.browser_fallback_url=" + 
                          encodeURIComponent(fallbackUrl) + ";end";

        document.getElementById("openAppBtn").href = intentUri;
        document.getElementById("downloadBtn").href = apkDownloadUrl;

        window.onload = function() {
            if (isFallback) {
                // If fallback triggered, directly trigger APK download
                triggerDownload();
            } else {
                // First load: Try launching the app
                let startTime = Date.now();
                window.location.replace(intentUri);

                // Safe fallback in case intent fails silently
                setTimeout(function() {
                    if (Date.now() - startTime < 3000) {
                        triggerDownload();
                    }
                }, 1500);
            }
        };

        function triggerDownload() {
            document.getElementById("titleText").innerText = "Shield Pro Download";
            document.getElementById("statusText").innerText = "App not detected. Starting APK download...";
            document.getElementById("openAppBtn").style.display = "none";
            
            const dlBtn = document.getElementById("downloadBtn");
            dlBtn.style.display = "block";
            
            // Automatically start the download
            window.location.href = apkDownloadUrl;
        }
    </script>
</body>
</html>
