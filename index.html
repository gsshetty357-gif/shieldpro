<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shield Pro Redirect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0f172a; /* Premium Dark Slate */
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 24px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .shield-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        p {
            margin: 0 0 24px 0;
            font-size: 14px;
            color: #94a3b8;
        }
        .manual-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .manual-btn:hover { background: #1d4ed8; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
    <script>
        window.onload = function() {
            var queryString = window.location.search;
            var intentUri = "intent://play" + queryString + "#Intent;scheme=shieldpro;package=com.aistudio.shieldpro.vltq;end";
            
            // Execute redirect immediately
            window.location.replace(intentUri);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="shield-icon">🛡️</div>
        <h2>Opening Shield Pro</h2>
        <p>Routing to your secure study session...</p>
        <a id="manualLink" href="#" class="manual-btn">Open App Manually</a>
    </div>
    
    <script>
        document.getElementById("manualLink").href = "intent://play" + window.location.search + "#Intent;scheme=shieldpro;package=com.aistudio.shieldpro.vltq;end";
    </script>
</body>
</html>
